<!DOCTYPE html>
<html lang="en" xmlns:hx-on="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOSS - Training</title>
    <link rel="stylesheet" href="/web/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
<main class="container">
    <nav class="navbar">
        <div class="nav-brand">
            <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43 1.43 1.43 2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43 1.43-1.43z"/>
            </svg>
            FOSS
        </div>
        <ul class="nav-links">
            <li><a href="/">Dashboard</a></li>
            <li><a href="/training" class="active">Training</a></li>
            <li><a href="/diet">Diet</a></li>
        </ul>
    </nav>

    <section>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h2 style="font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 0.25rem;">Workout Routines</h2>
                <p style="color: var(--color-text-dim); font-size: 0.875rem;">Manage and inspect your training templates.</p>
            </div>
            <button class="btn btn-primary" onclick="document.getElementById('create-modal').showModal()">
                + New Routine
            </button>
        </div>

        <div id="routines-container" hx-get="/web/training/list" hx-trigger="load" hx-swap="innerHTML">
            <div style="text-align: center; color: var(--color-text-dim); padding: 2rem;">Loading training routines...</div>
        </div>
    </section>

    <dialog id="routine-modal">
        <div class="modal-box">
            <div id="routine-detail-modal-content">
                <div style="text-align: center; color: var(--color-text-dim);">Loading details...</div>
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="btn btn-secondary" onclick="document.getElementById('routine-modal').close()">Close</button>
            </div>
        </div>
    </dialog>

    <dialog id="create-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 style="margin: 0; font-size: 1.2rem; color: #fff;">Create Routine</h3>
            </div>
            <form hx-post="/web/training/list" hx-target="#routines-container" hx-on::after-request="document.getElementById('create-modal').close(); this.reset();">
                <div class="form-group">
                    <label for="name">Routine Name</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="e.g. Push Day, Upper A" required>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('create-modal').close()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </dialog>
</main>
</body>
</html>
