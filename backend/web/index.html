<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOSS</title>
    <!-- PicoCSS jako baza resetująca -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        :root {
            --color-bg: #0b0d10;
            --color-surface: #14171c;
            --color-surface-2: #1c2027;
            --color-border: #262b33;
            --color-text: #e7e9ee;
            --color-text-dim: #8b93a1;
            --color-accent: #4f8cff;
            --radius-md: .375rem;
            --pico-background-color: var(--color-bg);
            --pico-color: var(--color-text);
            --pico-h1-color: #ffffff;
            --pico-h2-color: #ffffff;
            --pico-h3-color: #ffffff;
            --pico-card-background-color: var(--color-surface);
            --pico-border-color: var(--color-border);
            --pico-primary: var(--color-accent);
            --pico-primary-background: var(--color-accent);
            --pico-primary-hover-background: #3a70db; /* Lekko ciemniejszy accent */
            --pico-border-radius: var(--radius-md);
            --pico-font-family-sans-serif: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --pico-form-element-focus-color: var(--color-accent);
            --pico-primary-focus: rgba(79, 140, 255, 0.25);
        }

        body {
            padding-top: 2rem;
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--pico-font-family-sans-serif);
        }

        .widget-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
        .widget {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            box-shadow: none;
        }

        .widget h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--color-text-dim);
            text-align: center;
        }

        .widget .value {
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        progress {
            --pico-progress-background-color: var(--color-surface-2);
            --pico-progress-color: var(--color-accent);
            margin-bottom: 1rem;
            border-radius: 999px;
            height: 0.5rem;
        }

        .macro-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
            color: var(--color-text-dim);
        }

        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; margin-left: 1rem; color: var(--color-text-dim); }

        nav li strong { color: var(--color-text); font-weight: 600; letter-spacing: 0.05em;}
        nav a.secondary { color: var(--color-text-dim) !important; font-weight: 500; transition: color 0.2s;}
        nav a.secondary:hover { color: var(--color-text) !important; background: transparent !important;}
        nav a.active { color: var(--color-accent) !important; }

        .widget button.outline {
            border-color: var(--color-border);
            color: var(--color-text-dim);
        }
        .widget button.outline:hover {
            border-color: var(--color-text-dim);
            color: var(--color-text);
            background: transparent;
        }
    </style>
</head>
<body>
<main class="container">
    <nav>
        <ul>
            <li><strong>FOSS</strong></li>
        </ul>
        <ul>
            <li><a href="/" class="secondary active">Dashboard</a></li>
            <li><a href="/routines" class="secondary">Routines</a></li>
            <li><a href="/diet" class="secondary">Diet</a></li>
        </ul>
    </nav>

    <section style="margin-top: 2rem;">
        <h2 style="font-size: 1.5rem; font-weight: 600;">Overview</h2>
        <p style="color: var(--color-text-dim); font-size: 0.9rem;">Real-time data fetched from SQLite database.</p>

        <div hx-get="/api/dashboard/widgets" hx-trigger="load" hx-target="#stats-grid">
            <span class="htmx-indicator" aria-busy="true">Loading metrics...</span>
        </div>

        <div id="stats-grid" class="widget-grid">
            <!-- HTMX injects widgets here -->
        </div>
    </section>
</main>
</body>
</html>
