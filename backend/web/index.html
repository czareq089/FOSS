<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOSS</title>
    <link rel="stylesheet" href="/web/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<main class="container">
    <nav class="navbar">
        <div class="nav-brand">
            <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43 1.43 1.43 2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43 1.43-1.43z"/>
            </svg>
            FOSS
        </div>
        <ul class="nav-links">
            <li><a href="/" class="active">Dashboard</a></li>
            <li><a href="/training">Training</a></li>
            <li><a href="/diet">Diet</a></li>
        </ul>
    </nav>

    <section id="dashboard">
        <div id="stats-grid" class="widget-grid">

            <div hx-get="/api/widgets/volume" hx-trigger="load" hx-swap="outerHTML">
                <div class="widget"><div style="color: var(--color-text-dim);">Loading volume...</div></div>
            </div>

            <div hx-get="/api/widgets/reps" hx-trigger="load" hx-swap="outerHTML">
                <div class="widget"><div style="color: var(--color-text-dim);">Loading reps...</div></div>
            </div>

            <div class="widget col-span-2">
                <div class="widget-header">
                    <span class="widget-title">Trend tonażu (ostatnie sesje)</span>
                    <span style="font-size: 0.75rem; color: var(--color-success); font-weight: 600;">● Active</span>
                </div>
                <div style="height: 120px; width: 100%;">
                    <canvas id="volumeChart"></canvas>
                </div>
            </div>

            <div class="col-span-2" hx-get="/api/widgets/top-exercises" hx-trigger="load" hx-swap="outerHTML">
                <div class="widget"><div style="color: var(--color-text-dim);">Loading top exercises...</div></div>
            </div>

            <div hx-get="/api/widgets/biggest-progress" hx-trigger="load" hx-swap="outerHTML">
                <div class="widget"><div style="color: var(--color-text-dim);">Loading progress...</div></div>
            </div>

            <div hx-get="/api/widgets/overall-progress" hx-trigger="load" hx-swap="outerHTML">
                <div class="widget"><div style="color: var(--color-text-dim);">Loading consistency...</div></div>
            </div>

            <div class="col-span-2" hx-get="/api/widgets/macros" hx-trigger="load" hx-swap="outerHTML">
                <div class="widget"><div style="color: var(--color-text-dim);">Loading nutrition...</div></div>
            </div>

            <div class="col-span-2" hx-get="/api/widgets/macro-deficit" hx-trigger="load" hx-swap="outerHTML">
                <div class="widget"><div style="color: var(--color-text-dim);">Loading deficit...</div></div>
            </div>

        </div>
    </section>
</main>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const canvas = document.getElementById('volumeChart');
        if (!canvas) return;

        try {
            const res = await fetch('/api/widgets/volume-history');
            const data = await res.json();

            const labels = (data.labels && data.labels.length > 0) ? data.labels : ['No workouts logged.'];
            const chartData = (data.data && data.data.length > 0) ? data.data : [0];

            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 120);
            gradient.addColorStop(0, 'rgba(79, 140, 255, 0.35)');
            gradient.addColorStop(1, 'rgba(79, 140, 255, 0.0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Volume (kg)',
                        data: chartData,
                        borderColor: '#4f8cff',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.2,
                        pointRadius: 4,
                        pointBackgroundColor: '#4f8cff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (context) => ` ${context.parsed.y.toFixed(1)} kg`
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.04)' },
                            ticks: { color: '#8b93a1', font: { size: 10 } }
                        },
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.04)' },
                            ticks: { color: '#8b93a1', font: { size: 10 } }
                        }
                    }
                }
            });
        } catch (err) {
            console.error('Error while loading the chart:', err);
        }
    });
</script>
</body>
</html>
